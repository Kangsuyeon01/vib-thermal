<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vib-Thermal Editor</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="static/main.css">
    <link rel="stylesheet" type="text/css" href="static/drawcanvas.css">
    <script src="static/drawcanvas.mjs" type="module"></script>
    <script src="static/np-waveform-canvas.mjs" type="module"></script>
    <script src="static/main.mjs" type="module"></script>
</head>
    <body>
        <h2>trial: <span id="trial_current_label">1</span>/ <span id="trial_end_label"></span></h2>
        <div class="main-container">
          <div class="signal-container card">
            <div class="vibration">
              <h1>Vibrotactile Feedback</h1>
      
              <div class="envelope">
                <h2>Amplitude Envelope:</h2>
                <div class="canvas-with-axis">
                  <div class="y-axis-labels">
                    <span>1</span>
                    <span>0.5</span>
                    <span>0</span>
                  </div>
                  <draw-canvas id="drawvibaenv" height="100" stroke-color="blue"></draw-canvas>
                </div>
              </div>
      
              <div class="envelope">
                <h2>Frequency Envelope:</h2>
                <div class="canvas-with-axis">
                  <div class="y-axis-labels">
                    <span>500</span>
                    <span>275</span>
                    <span>50</span>
                  </div>
                  <draw-canvas id="drawvibfenv" height="100" stroke-color="green"></draw-canvas>
                </div>
              </div>
      
              <div class="envelope">
                <h2>Final Waveform:</h2>
                <div class="canvas-with-axis">
                    <div class="y-axis-labels">
                      <span> </span>
                      <span> </span>
                      <span> </span>
                    </div>
                  <np-waveform-canvas id="vibrationwaveform" height="100"></np-waveform-canvas>
                </div>
              </div>
            </div>
      
            <div class="thermal">
              <h1>Thermal Feedback</h1>
      
              <div class="envelope">
                <h2><label for="tempamp">Amplitude Envelope:</label></h2>
                <div class="canvas-with-axis">
                  <div class="y-axis-labels">
                    <span>+6</span>
                    <span>0</span>
                    <span>-6</span>
                  </div>
                  <draw-canvas id="drawthraenv" height="100" stroke-color="red"></draw-canvas>
                </div>
              </div>
            </div>
            <div>
              <div class="envelope">
                <h2><label for="signalduration">Duration:</label></h2>
                <div class="slider-wrapper">
                  <span class="slider-value" id="duration-value">10</span>
                  <input type="range" min="0" max="10" value="10" id="signalduration"
                    oninput="document.getElementById('duration-value').textContent = this.value" />
                </div>
              </div>
            </div>
      
            <span id="alert_signal_label" class="alertlabel"></span>
            <span>
              <span class="button-group">
                <button class="play" id="playsignal">PLAY</button>
                <button class="reset" id="resetsignal">RESET</button>
              </span>
            </span>
          </div>
        <div class="posrate-container">
            <div class="bodysite">
                {% include 'body_point_load.html' %}
            </div>
            <div class="card ratingcard">
                <span id="alert_slider_label" class="alertlabel"></span>
                <form class="ratings"><!-- Roughness -->
                  <div class="slider-row">
                    <label class="side-label"><br><br><br><br>0<br>smooth</label>
                    <div class="slider-wrapper">
                      <h2><label for="roughness">Roughness</label></h2>
                      <span class="slider-value" id="roughness-value">50</span>
                      <input type="range" min="0" max="100" value="50" id="roughness"
                        oninput="document.getElementById('roughness-value').textContent = this.value">
                    </div>
                    <label class="side-label"><br><br><br><br>100<br>rough</label>
                  </div>
                  
                  <!-- Valence -->
                  <div class="slider-row">
                  <label class="side-label"><br><br><br><br>0<br>unpleasant</label>
                    <div class="slider-wrapper">
                      <h2><label for="valence">Valence</label></h2>
                      <span class="slider-value" id="valence-value">50</span>
                      <input type="range" min="0" max="100" value="50" id="valence"
                        oninput="document.getElementById('valence-value').textContent = this.value">
                    </div>
                    <label class="side-label"><br><br><br><br>100<br>pleasant</label>
                  </div>
                  
                  <!-- Warmness -->
                  <div class="slider-row">
                    <label class="side-label"><br><br><br><br><br><br>0<br>cool</label>
                    <div class="slider-wrapper">
                    <h2><label for="warmness">Warmness</label></h2>
                      <span class="slider-value" id="warmness-value">50</span>
                      <input type="range" min="0" max="100" value="50" id="warmness"
                        oninput="document.getElementById('warmness-value').textContent = this.value">
                    </div>
                    <label class="side-label"><br><br><br><br><br><br>100<br>hot</label>
                  </div>
                  
                  <!-- Arousal -->
                  <div class="slider-row">
                    <label class="side-label"><br><br><br><br><br><br>0<br>calm</label>
                    <div class="slider-wrapper">
                      <h2><label for="arousal">Arousal<br></label></h2>
                      <span class="slider-value" id="arousal-value">50</span>
                      <input type="range" min="0" max="100" value="50" id="arousal"
                        oninput="document.getElementById('arousal-value').textContent = this.value">
                    </div>
                    <label class="side-label"><br><br><br><br><br><br>100<br>excited</label>
                  
                  </div>
                    <div class="envelope referral-container">
                        <h2><label for="referral">Referral</label></h2>
                        <span class="radio-options">
                            <label for="none">
                                <input type="radio" id="none" name="referral" value="none">
                                <span>None</span>
                            </label>
                            <label for="referral_option">
                                <input type="radio" id="referral_option" name="referral" value="referral">
                                <span>Referral</span> 
                            </label>
                            <label for="masking">
                                <input type="radio" id="masking" name="referral" value="masking">
                                <span>Masking</span>
                            </label>
                        </span>
                    </div>                    
				<span class="options">  
					<!-- <input type="reset" value="Reset"> -->
                    <span id="alert_referral_label" class="alertlabel"></span>
				</span>
            </form>
            <div>
                <button id="submit">Submit</button>
                <span id="submitstatus" class="alertlabel"></span>
            </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vib-Thermal Editor</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="static/main.css">
    <script src="static/drawcanvas.js" type="module"></script>
</head>
<body>
    <div class="main-container">
        <div class="container signal-container">
            <div class="vibration">
                <h1>Vibrotactile Feedback</h1>
                <div class="envelope">
                    <h2>Temporal Envelope:</h2>
                    <draw-canvas stroke-color="blue"></draw-canvas>
                </div>
                <div class="envelope">
                    <h2>Frequency Envelope:</h2>
                    <draw-canvas stroke-color="green"></draw-canvas>
                </div>
                <div class="envelope">
                    <h2><label for="vibduration">Duration:</label></h2>
                    <input type="range" min="0" max="10" value="5" id="vibduration">
                </div>
            </div>
            <div class="thermal">
                <h1>Thermal Feedback</h1>
                <!-- <div class="envelope">
                    <h2><label for="tempamp">Amplitude of Change:</label></h2>
                    <input type="range" min="-8" max="8" value="0" id="tempamp">
                </div> -->
				<div class="envelope">
					<h2><label for="tempamp">Temporal Envelope:</label></h2>
					<draw-canvas stroke-color="red"></draw-canvas>
                </div>
                <div class="envelope">
                    <h2><label for="tempduration">Duration:</label></h2>
                    <input type="range" min="0" max="10" value="5" id="tempduration">
                </div>
            </div>
            <button class="play">PLAY</button>
        </div>
        <div>
            <!-- <div class="bodysite"> -->
                {% include 'body_point_load.html' %}
            <!-- </div> -->
            <div class="card">
                <form class="ratings">
                    <div class="envelope">
                        <h2><label for="roughness">Roughness:</label></h2>
                        <input type="range" min="0" max="100" value="50" id="roughness">
                    </div>
                    <div class="envelope">
                        <h2><label for="valence">Valence:</label></h2>
                        <input type="range" min="0" max="100" value="50" id="valence">
                    </div>
                    <div class="envelope">
                        <h2><label for="warmness">Warmness:</label></h2>
                        <input type="range" min="0" max="100" value="50" id="warmness">
                    </div>
                    <div class="envelope">
                        <h2><label for="arousal">Arousal:</label></h2>
                        <input type="range" min="0" max="100" value="50" id="arousal">
                    </div>
				<div class="envelope referral-container">
					<label for="referral">Referral:</label>
					<span class="radio-options">
						<span>
						<input type="radio" id="none" name="referral" value="none">
						<label for="none">None</label>
						</span>
						<span>
						<input type="radio" id="referral" name="referral" value="referral">
						<label for="referral">Referral</label>
						</span>
						<span>
						<input type="radio" id="masking" name="referral" value="masking">
						<label for="masking">Masking</label>
						</span>
					</span>
				</div>
				<span class="options">  
					<input type="reset" value="Reset">
					<input type="submit" value="Submit">
				</span>
            </form>
            </div>
        </div>
    </div>
</body>
</html>
